[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-rf-estimation"
version = "0.1.0"
description = "Complex I/Q separation and generalization experiments for drone RF records"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]
